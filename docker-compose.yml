# Demo: gateways -> outbox -> relay -> router -> RabbitMQ -> workers.
# Serviços de aplicação são adicionados nas tasks de cada serviço.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["55432:5432"]
    volumes:
      # init.sql roda só no primeiro boot (volume vazio).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["55672:5672", "55673:15672"]
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # Webhook que decide o worker pelo type e publica no RabbitMQ (só porta interna 8080).
  router:
    build: ./services/router
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq: { condition: service_healthy }

  # Drena a outbox: lê linhas pendentes no Postgres e faz POST ao router.
  relay:
    build: ./services/relay
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      ROUTER_URL: http://router:8080/dispatch
      POLL_INTERVAL: 1s
    depends_on:
      postgres: { condition: service_healthy }
      router: { condition: service_started }

  # Consome jobs.go (image.resize) com uma goroutine por mensagem.
  worker-go:
    build: ./services/worker-go
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Consome jobs.asyncio (http.fetch) com aio-pika: uma task asyncio por mensagem.
  worker-asyncio:
    build: ./services/worker-asyncio
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Celery: bridge lê jobs.celery e chama process_job.delay; o worker executa a task.
  worker-celery-bridge:
    build: ./services/worker-celery
    command: python -m app.bridge
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq: { condition: service_healthy }

  worker-celery:
    build: ./services/worker-celery
    command: celery -A app.tasks worker --concurrency=4 --loglevel=info --without-mingle --without-gossip
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # TaskIQ: bridge lê jobs.taskiq e chama process_job.kiq; o worker executa a task.
  worker-taskiq-bridge:
    build: ./services/worker-taskiq
    command: python -m app.bridge
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      TASKIQ_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq: { condition: service_healthy }

  worker-taskiq:
    build: ./services/worker-taskiq
    command: taskiq worker app.tasks:broker --workers 1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      TASKIQ_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  gateway-py:
    build: ./services/gateway-py
    restart: unless-stopped
    ports: ["58001:8000"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
    depends_on:
      postgres: { condition: service_healthy }

  gateway-go:
    build: ./services/gateway-go
    restart: unless-stopped
    ports: ["58002:8000"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
    depends_on:
      postgres: { condition: service_healthy }
